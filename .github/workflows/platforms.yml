name: Platform compatibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/platforms.yml']
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm exec vitest run tests/git-workspaces.spec.ts tests/team-git-runtime.spec.ts tests/worker-launchers.spec.ts tests/native-paths.spec.ts tests/team-panel.spec.tsx tests/delivery.spec.ts --maxWorkers=2
      - run: pnpm build
